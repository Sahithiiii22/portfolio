<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)"/>
  <circle cx="200" cy="180" r="140" fill="url(#glowGrad)" filter="url(#glow)" opacity="0.4"/>
  <circle cx="200" cy="200" r="160" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="8 8"/>
  <circle cx="200" cy="200" r="130" stroke="#a855f7" stroke-width="1" stroke-opacity="0.3"/>
  
  <circle cx="110" cy="120" r="6" fill="#38bdf8" opacity="0.8"/>
  <circle cx="290" cy="110" r="7" fill="#a855f7" opacity="0.8"/>
  <circle cx="90" cy="280" r="5" fill="#6366f1" opacity="0.8"/>
  <circle cx="310" cy="270" r="6" fill="#38bdf8" opacity="0.8"/>
  <line x1="110" y1="120" x2="160" y2="150" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="290" y1="110" x2="240" y2="150" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <circle cx="200" cy="170" r="65" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="4" filter="url(#glow)"/>
  <text x="200" y="182" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="42" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">ST</text>
  
  <rect x="90" y="265" width="220" height="36" rx="18" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="1.5"/>
  <text x="200" y="288" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">Sahithi Tarigoppula</text>
  
  <rect x="115" y="315" width="170" height="28" rx="14" fill="rgba(99, 102, 241, 0.2)" stroke="#6366f1" stroke-width="1"/>
  <text x="200" y="334" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="middle">AI/ML &amp; Data Science</text>
</svg>